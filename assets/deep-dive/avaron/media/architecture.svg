<title id="title">AVARON architecture reconstructed from repository source</title><desc id="desc">Flutter authenticates with GoTrue. Requests go to NestJS or PostgREST. NestJS verifies JWTs and applies route guards. Transaction-scoped claims and roles preserve database row-level security in CloudNativePG on k3s. Release and candidate infrastructure surround the application.</desc>
